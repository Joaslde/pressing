<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Derrière le reverse proxy de Coolify (Traefik/Caddy), l'IP source de
    # toutes les requêtes est celle du proxy. mod_remoteip restaure la vraie
    # IP client depuis X-Forwarded-For pour les logs Apache ; côté Laravel,
    # c'est TrustProxies (bootstrap/app.php) qui fait l'équivalent.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 127.0.0.1

    # Le healthcheck interne interroge /up toutes les 30s : inutile de le
    # journaliser, il noierait les vraies requêtes.
    SetEnvIf Request_URI "^/up$" no_access_log

    # Logs vers stdout/stderr : c'est ce que Docker et Coolify collectent.
    # %a (et non %h) journalise l'IP restaurée par mod_remoteip.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
    ErrorLog /dev/stderr
    CustomLog /dev/stdout proxied env=!no_access_log
</VirtualHost>
