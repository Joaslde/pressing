; Réglages PHP pour la production (chargés en dernier : zz-*.ini).

; --- Erreurs : jamais dans la réponse HTTP, toujours dans les logs Docker ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

; --- Limites --------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; --- OPcache : le gain de perf principal d'un déploiement PHP -------------
; validate_timestamps=0 : le code ne change jamais dans un conteneur (une
; nouvelle image = un nouveau conteneur), donc inutile de vérifier les mtime
; à chaque requête.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; --- Sécurité / divers ----------------------------------------------------
date.timezone = UTC
session.cookie_httponly = 1
session.use_strict_mode = 1
